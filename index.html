<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231c1917%22/><circle cx=%2250%22 cy=%2250%22 r=%2225%22 fill=%22%23f5f5f4%22/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photogallery</title>
    <meta name="description" content="A 9-photo gallery grid with placeholder images and titles" />
    <meta property="og:title" content="Photogallery" />
    <meta property="og:description" content="A 9-photo gallery grid with placeholder images and titles" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        line-height: 1.5;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      .bg-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .gallery-container {
        max-width: 64rem;
        margin: 0 auto;
        padding: 2.5rem 1rem;
        position: relative;
        z-index: 10;
      }
      .gallery-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }
      .gallery-title {
        font-size: 2.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
        color: #ffffff;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      .gallery-desc {
        color: #a1a1aa;
        margin: 0;
        font-size: 1.05rem;
        font-weight: 500;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 1.5rem;
      }
      @media (max-width: 640px) {
        .photo-grid {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
        }
      }
      .photo-card {
        background-color: #141418;
        border-radius: 0.875rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .photo-card:hover {
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.28);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8), 0 0 24px rgba(255, 255, 255, 0.06);
      }
      .photo-wrapper {
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background-color: #1e1e24;
      }
      .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }
      .photo-card:hover .photo-img {
        transform: scale(1.05);
      }
      .photo-caption {
        padding: 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #141418;
      }
      .photo-category {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #a1a1aa;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .photo-heading {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        color: #fafafa;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body class="antialiased min-h-screen">
    <!-- Interactive Floating Particle Canvas on Black Background -->
    <canvas id="bg-canvas" class="bg-canvas" aria-hidden="true"></canvas>

    <div id="root">
      <div id="gallery-app" class="gallery-container">
        <header id="gallery-header" class="gallery-header">
          <h1 id="gallery-main-title" class="gallery-title">Photo Gallery</h1>
          <p id="gallery-subtitle" class="gallery-desc">Michael's Photos</p>
        </header>

        <main id="photo-grid" class="photo-grid">
          <!-- Row 1, Column 1 -->
          <article id="photo-card-1" class="photo-card">
            <div class="photo-wrapper">
              <img
                id="photo-img-1"
                class="photo-img"
                src="images/spiderman.jpg"
                alt="Spider-Man"
                loading="lazy"
                onerror="if(!this.dataset.retry){this.dataset.retry='1';this.src='/images/spiderman.jpg';}"
              />
            </div>
            <div class="photo-caption">
              <span class="photo-category">Marvel</span>
              <h2 id="photo-title-1" class="photo-heading">Spider-Man</h2>
            </div>
          </article>

          <!-- Row 1, Column 2 -->
          <article id="photo-card-2" class="photo-card">

              />

            <div class="photo-caption">

          </article>

          <!-- Row 2, Column 1 -->

          <!-- Row 2, Column 3 -->

          <!-- Row 3, Column 2 -->
          <article id="photo-card-8" class="photo-card">

              <h2 id="photo-title-9" class="photo-heading">Elote</h2>
            </div>
          </article>
        </main>
      </div>
    </div>

    <script>
      (function() {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let width = 0;
        let height = 0;
        let particles = [];
        const mouse = { x: -1000, y: -1000, radius: 140 };

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initParticles();
        }

        const palette = [
          'rgba(255, 49, 88, ',    // Vivid Electric Crimson/Pink
          'rgba(255, 110, 20, ',   // Radiant Neon Orange
          'rgba(255, 225, 0, ',    // Bright Cyber Yellow
          'rgba(16, 235, 120, ',   // Vivid Neon Green
          'rgba(0, 240, 255, ',    // Electric Cyan
          'rgba(60, 130, 255, ',   // Neon Electric Blue
          'rgba(175, 70, 255, ',   // Vivid Electric Violet
          'rgba(255, 30, 190, '    // Glowing Hot Magenta
        ];

        function initParticles() {
          particles = [];
          const count = Math.min(Math.max(Math.floor((width * height) / 24000), 32), 65);
          for (let i = 0; i < count; i++) {
            const isLarge = Math.random() > 0.72;
            const baseRad = isLarge ? Math.random() * 8 + 10 : Math.random() * 5 + 5.5;
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              radius: baseRad,
              baseRadius: baseRad,
              color: palette[Math.floor(Math.random() * palette.length)],
              alpha: Math.random() * 0.25 + 0.6,
              vx: (Math.random() - 0.5) * 2.5,
              vy: (Math.random() - 0.5) * 2.5,
              pulse: Math.random() * Math.PI * 2,
              pulseSpeed: Math.random() * 0.035 + 0.02
            });
          }
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
          mouse.x = -1000;
          mouse.y = -1000;
        });
        window.addEventListener('touchmove', (e) => {
          if (e.touches && e.touches[0]) {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
          }
        }, { passive: true });
        window.addEventListener('touchend', () => {
          mouse.x = -1000;
          mouse.y = -1000;
        });

        resize();

        function render() {
          ctx.clearRect(0, 0, width, height);

          // Update and draw particles
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            // Move with velocity plus organic wavy drift
            p.x += p.vx + Math.sin(p.pulse) * 0.95;
            p.y += p.vy + Math.cos(p.pulse) * 0.95;
            p.pulse += p.pulseSpeed;

            // Wrap boundaries smoothly
            if (p.x < -30) p.x = width + 30;
            else if (p.x > width + 30) p.x = -30;
            if (p.y < -30) p.y = height + 30;
            else if (p.y > height + 30) p.y = -30;

            // Interactive mouse repulsion
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius && dist > 0) {
              const force = (mouse.radius - dist) / mouse.radius;
              p.x -= (dx / dist) * force * 5.5;
              p.y -= (dy / dist) * force * 5.5;
            }

            const currentRadius = Math.max(2, p.baseRadius + Math.sin(p.pulse) * 1.8);
            const currentAlpha = Math.max(0.35, Math.min(0.95, p.alpha + Math.sin(p.pulse) * 0.18));

            // Radiant neon glow effect
            ctx.shadowColor = p.color + '0.9)';
            ctx.shadowBlur = 14;

            ctx.beginPath();
            ctx.arc(p.x, p.y, currentRadius, 0, Math.PI * 2);
            ctx.fillStyle = p.color + currentAlpha + ')';
            ctx.fill();

            // Bright crisp rim
            ctx.lineWidth = 1.6;
            ctx.strokeStyle = p.color + '0.95)';
            ctx.stroke();

            // Soft luminous specular core
            ctx.beginPath();
            ctx.arc(p.x - currentRadius * 0.26, p.y - currentRadius * 0.26, Math.max(1, currentRadius * 0.32), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (currentAlpha * 0.7) + ')';
            ctx.fill();

            ctx.shadowBlur = 0;

            // Connect nearby rainbow particles with subtle glowing filaments
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist2 = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist2 < 145) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                const lineAlpha = (1 - dist2 / 145) * 0.32;
                ctx.strokeStyle = p.color + lineAlpha + ')';
                ctx.lineWidth = 1.1;
                ctx.stroke();
              }
            }
          }

          requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
      })();
    </script>
  </body>
</html>
